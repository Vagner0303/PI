<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudeAqui</title>
    <link rel="shortcut icon" href="../img/logo_16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <!-- Este é o titulo de Login -->
    <div class="titulo">
        <h1>Entrar na sua conta</h1>
        <h2>Que bom ter você de volta!</h2>
    </div>

    <!-- Essa é a parte de colocar as informações de login -->
    <div class="login">
       <div class="icone">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="E-mail">
       </div>

       <div class="icone">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Senha">
       </div>
        <a href="http://127.0.0.1:5500/home.html"><button class="entrar">Entrar</button></a>

        <p class="ou">───────────── ou ─────────────</p>

        <button class="google">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.6 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.2C12.43 13.09 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.98-2.26 5.52-4.8 7.23l7.4 5.75c4.3-3.98 6.78-9.83 6.78-17.45z"/>
              <path fill="#FBBC05" d="M10.54 28.43c-1.02-2.98-1.02-6.18 0-9.16l-7.98-6.2C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.93l7.98-6.5z"/>
              <path fill="#34A853" d="M24 48c6.6 0 12.14-2.18 16.19-5.93l-7.4-5.75c-2.05 1.38-4.7 2.18-8.79 2.18-6.26 0-11.57-3.59-13.46-8.77l-7.98 6.5C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Entrar com o Google
        </button>

        <div class="c">
            <p class="info-criar">Ainda não tem conta?</p>
            <button class="criar-conta">Criar conta</button>
        </div>
    </div>

</body>
</html>
