<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cada.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>EstudeAqui</title>
    <link rel="shortcut icon" href="../img/logo_16x16.png" type="image/x-icon">
</head>
<body>

    <div class="container">
        <form class="form">
            <h1>Cadastrar-se no nosso site!</h1>

            <div class="info">
                <input placeholder="Nome" type="text" required>
                <img width="21" height="20" src="https://img.icons8.com/sf-regular/48/user.png" alt="user"/>
            </div>

            <div class="info">
                <input placeholder="Email" type="email" required>
                <img width="18" height="18" src="https://img.icons8.com/material-outlined/24/new-post.png" alt="new-post" />
            </div>

            <div class="info">
                <input placeholder="Senha" type="password" required>
                <img width="18" height="18" src="https://img.icons8.com/forma-regular/24/lock.png" alt="lock" />
            </div>

            <button type="submit" class="btn-cadastro">Cadastrar-se</button>

            <div class="login">
                <p>Já possui conta? <a href="./login.html">Faça login</a></p>
            </div>


        </form>
    </div>

</body>
</html>
