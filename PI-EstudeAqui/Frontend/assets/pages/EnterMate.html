<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudeAqui - Matéria</title>

    <link rel="shortcut icon" href="../img/logo_16x16.png" type="image/x-icon">
    <script src="../scripts/tema.js"></script>
    <link rel="stylesheet" href="../styles/EnterMate.css">
    <!-- CSS novo, só desta tela: carregue depois do materias.css -->
    <link rel="stylesheet" href="../styles/materia.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../scripts/ProtejePages.js"></script>
</head>
<body>

    <div class="pagina">

        <header class="cabecalho">
            <div class="dentro-cabecalho">
                <div class="acoes">
                    <button id="alterartema" class="botao-icone" aria-label="Tema" type="button">
                        <i data-lucide="moon" style="width:18px; height:18px; stroke-width:1.75;"></i>
                    </button>

                    <a href="./config.html" class="botao-icone botao-perfil" aria-label="Perfil">
                        <i data-lucide="user" style="width:16px; height:16px; stroke-width:2;"></i>
                    </a>
                </div>
            </div>
        </header>

        <div class="corpo">

            <aside class="barra-lateral">
                <nav class="dentro-lateral">
                    <a href="./home.html" class="opcao">
                        <i data-lucide="layout-dashboard"></i>
                        Início
                    </a>

                    <a href="./materias.html" class="opcao ativo">
                        <i data-lucide="book-marked"></i>
                        Matérias
                    </a>

                    <a href="./cronograma.html" class="opcao">
                        <i data-lucide="calendar-range"></i>
                        Cronograma
                    </a>

                    <a href="./metas.html" class="opcao">
                        <i data-lucide="goal"></i>
                        Metas
                    </a>

                    <a href="./desempenho.html" class="opcao">
                        <i data-lucide="chart-spline"></i>
                        Desempenho
                    </a>

                    <a href="./config.html" class="opcao">
                        <i data-lucide="settings"></i>
                        Configurações
                    </a>
                </nav>
            </aside>

            <main class="conteudo">

                <!-- Breadcrumb -->
                <nav class="navegacao" aria-label="Você está em">
                    <a href="./materias.html">Matérias</a>
                    <i data-lucide="chevron-right"></i>
                    <span id="materia-breadcrumb" aria-current="page">Carregando...</span>
                </nav>

                <!-- Cabeçalho da matéria (preenchido pelo EnterMate.js) -->
                <section class="materia-topo">
                    <div class="materia-icone">
                        <i data-lucide="book-open"></i>
                    </div>
                    <div>
                        <h1 id="materia-nome">Carregando...</h1>
                        <p class="conteudo-sub">
                            <i data-lucide="user-round"></i>
                            <span id="materia-professor">Professor: -</span>
                        </p>
                        <p class="conteudo-sub" id="materia-descricao"></p>
                    </div>
                </section>

                <!-- Controle das abas (CSS puro, sem JS) -->
                <input class="aba-input" type="radio" name="aba" id="aba-tarefas" checked>
                <input class="aba-input" type="radio" name="aba" id="aba-anotacoes">
                <input class="aba-input" type="radio" name="aba" id="aba-links">

                <div class="abas" role="tablist">
                    <label for="aba-tarefas">Tarefas</label>
                    <label for="aba-anotacoes">Anotações</label>
                    <label for="aba-links">Links</label>
                </div>

                <div class="paineis">

                    <!-- ========== TAREFAS ========== -->
                    <section class="painel" id="painel-tarefas">
                        <div class="barra-acoes">
                            <div class="filtros">
                                <button type="button" class="filtro ativo" id="filtro-todas">Todas (0)</button>
                                <button type="button" class="filtro">Acertos (0)</button>
                                <button type="button" class="filtro">Erros (0)</button>
                            </div>

                            <div class="dropdown">
                                <button type="button" class="add-materia" id="btn-adicionar-tarefa">
                                    <i data-lucide="plus"></i>
                                    Nova tarefa
                                </button>

                                <div id="tarefa-dropdown" class="dropdown-panel dropdown-tarefa" hidden>
                                    <input id="tarefa-titulo" type="text" placeholder="Nome da tarefa" maxlength="150" />
                                    <p id="tarefa-erro" class="erro" hidden></p>
                                    <button type="button" class="add-materia" id="btn-salvar-tarefa">Gerar tarefa</button>
                                </div>
                            </div>
                        </div>

                        <!-- as tarefas são desenhadas pelo EnterMate.js -->
                        <div class="caixa lista-tarefas" id="lista-tarefas"></div>
                    </section>

                    <!-- ========== ANOTAÇÕES ========== -->
                    <section class="painel" id="painel-anotacoes">
                        <div class="caixa caixa-conteudo">
                            <div class="caixa-topo">
                                <h2>Suas anotações</h2>

                                <div class="dropdown">
                                    <button type="button" class="add-materia" id="btn-adicionar-nota">
                                        <i data-lucide="plus"></i>
                                        Adicionar anotação
                                    </button>

                                    <div id="nota-dropdown" class="dropdown-panel dropdown-nota" hidden>
                                        <input id="nota-titulo" type="text" placeholder="Título da anotação" maxlength="150" />
                                        <textarea id="nota-texto" placeholder="Escreva sua anotação..." rows="6"></textarea>
                                        <p id="nota-erro" class="erro" hidden></p>
                                        <button type="button" class="add-materia" id="btn-salvar-nota">Salvar</button>
                                    </div>
                                </div>
                            </div>

                            <div class="notas" id="lista-notas"></div>
                        </div>
                    </section>

                    <!-- ========== LINKS ========== -->
                    <section class="painel" id="painel-links">
                        <div class="caixa caixa-conteudo">
                            <div class="caixa-topo">
                                <h2>Seus links</h2>

                                <div class="dropdown">
                                    <button type="button" class="add-materia" id="btn-adicionar-link">
                                        <i data-lucide="plus"></i>
                                        Adicionar link
                                    </button>

                                    <div id="link-dropdown" class="dropdown-panel" hidden>
                                        <input id="link-nome" type="text" placeholder="Nome (ex: Link para a apresentação)" maxlength="100" />
                                        <input id="link-url" type="url" placeholder="https://..." />
                                        <p id="link-erro" class="erro" hidden></p>
                                        <button type="button" class="add-materia" id="btn-salvar-link">Salvar</button>
                                    </div>
                                </div>
                            </div>

                            <div class="links" id="lista-links"></div>
                        </div>
                    </section>

                </div>
            </main>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="../scripts/EnterMate.js"></script>
</body>
</html>
