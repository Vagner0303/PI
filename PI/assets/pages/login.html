<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudeAqui</title>
    <link rel="shortcut icon" href="../img/imagem_16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <!-- Este é o titulo de Login -->
    <div class="titulo">
        <h1>Entrar na sua conta</h1>
        <h2>Que bom ter você de volta!</h2>
    </div>

    <!-- Essa é a parte de colocar as informações de login -->
    <div class="login">
       <div class="icone">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="E-mail">
       </div>
    <!-- Esses são os icones do campo de colocar as informações-->
       <div class="icone">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Senha">
       </div>
    <!-- Esse é o icone de entrar e entrar no google -->
        <button class="entrar">Entrar</button>
        <p class="ou">───────────── ou ─────────────</p>
        <button class="google">Entrar com o Google</button>
            <div class="c">
                <p class="info-criar">Ainda não tem conta? </p>
                <button class="criar-conta">Criar conta</button>
           </div>
    </div>


</body>
</html>
