<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>EstudeAqui</title>
    <link rel="shortcut icon" href="../img/logo_16x16.png" type="image/x-icon">
</head>
<body>

    <div class="container">
        <form class="form">
            <h1>Entre na sua conta</h1>
            <h2>Que bom ter você de volta!</h2>

            <div class="info">
                <input placeholder="Email" type="email" required>
                <img width="18" height="18" src="https://img.icons8.com/material-outlined/24/new-post.png" alt="new-post" />
            </div>

            <div class="info">
                <input placeholder="Senha" type="password" required>
                <img width="18" height="18" src="https://img.icons8.com/forma-regular/24/lock.png" alt="lock" />
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>

            <div class="cadastro">
                <p>Não está cadastrado? <a href="./cada.html">Cadastrar-se</a></p>
            </div>

        </form>
    </div>

</body>
</html>
